name: Auto Fix

on:
  workflow_dispatch:

concurrency:
  group: auto-fix-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fix:
    name: Format and lint fix
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install project Yarn
        run: corepack install

      - name: Verify Node and Yarn
        run: |
          node --version
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Fix formatting
        run: yarn format

      - name: Fix lint
        run: yarn lint:fix

      - name: Type check
        run: yarn type-check

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "style: auto-fix formatting and lint"
          git push
