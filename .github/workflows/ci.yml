name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/

jobs:
  # ============================================================
  # Static checks
  # Runs in parallel with build + E2E
  # ============================================================
  static-check:
    name: Static check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Activate Yarn
        run: corepack prepare yarn@4.13.0 --activate

      - name: Verify Node and Yarn
        run: |
          node --version
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type check
        run: yarn type-check

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

  # ============================================================
  # Build + E2E
  # Runs in parallel with static-check.
  # ============================================================
  build-and-e2e:
    name: Build and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Activate Yarn
        run: corepack prepare yarn@4.13.0 --activate

      - name: Verify Node and Yarn
        run: |
          node --version
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate static site
        run: yarn generate

      - name: Install Chromium
        run: yarn playwright install --with-deps chromium

      - name: Run browser tests
        run: yarn test:e2e

      # Only reached when build AND E2E succeed.
      - name: Upload static site
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: .output/public
          retention-days: 1

  # ============================================================
  # Deploy
  # Uses the exact artifact generated by build-and-e2e.
  # ============================================================
  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs:
      - static-check
      - build-and-e2e

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download static site
        uses: actions/download-artifact@v4
        with:
          name: static-site
          path: .output/public

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .output/public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
