name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/

jobs:
  # ============================================================
  # Static checks
  # Runs independently from build and E2E
  # ============================================================
  static-check:
    name: Static check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type check
        run: yarn type-check

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

  # ============================================================
  # Build
  # Runs independently from static checks
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate static site
        run: yarn generate

      - name: Upload static site
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: .output/public
          retention-days: 1

  # ============================================================
  # E2E
  # Starts as soon as build succeeds.
  # Does NOT depend on static-check.
  # ============================================================
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Chromium
        run: yarn playwright install --with-deps chromium

      - name: Download static site
        uses: actions/download-artifact@v4
        with:
          name: static-site
          path: .output/public

      - name: Run browser tests
        run: yarn test:e2e

  # ============================================================
  # Deploy
  # Only runs when ALL required jobs succeed.
  # Skipped automatically for pull requests.
  # ============================================================
  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs:
      - static-check
      - build
      - e2e

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download static site
        uses: actions/download-artifact@v4
        with:
          name: static-site
          path: .output/public

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .output/public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
